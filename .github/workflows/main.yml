name: Organization Profile Updater

on:
  schedule:
    # Saturday 19:40 UTC is 03:40 AM China Standard Time
    - cron: '40 19 * * 6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: organization-profile-updater
  cancel-in-progress: true

jobs:
  update-members:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install image conversion dependency
        run: npm ci

      - name: Generate Member Profiles
        env:
          GITHUB_TOKEN: ${{ secrets.YRPENG_E3DA_RO }}
        run: node scripts/update-members.js

      - name: Validate Member Profiles
        run: node scripts/validate-members.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/README.md profile/members/

          if git diff --staged --quiet; then
            echo "No member data changes detected. Skipping git push."
            exit 0
          fi

          git commit -m "chore: update member profiles"
          git push origin main
