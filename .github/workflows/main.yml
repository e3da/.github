name: Organization Profile Updater

on:
  schedule:
    # Saturday 19:40 UTC is 03:40 AM China Standard Time
    - cron: '40 19 * * 6'
  workflow_dispatch:
    # Runs refresh metadata; manual runs also refresh raw avatar sources.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: organization-profile-updater
  cancel-in-progress: true

jobs:
  update-members:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate Member Profiles
        env:
          GITHUB_TOKEN: ${{ secrets.YRPENG_E3DA_RO }}
          UPDATE_AVATARS: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/update-members.js

      - name: Check JPG fallback coverage
        id: jpg-fallbacks
        run: echo "needed=$(node scripts/png2jpg.js --check)" >> "$GITHUB_OUTPUT"

      - name: Install sharp for JPG fallback
        if: steps.jpg-fallbacks.outputs.needed == 'true'
        run: npm install --no-save --no-package-lock sharp

      - name: Generate JPG fallbacks
        if: steps.jpg-fallbacks.outputs.needed == 'true'
        run: node scripts/png2jpg.js

      - name: Refresh profile image references
        env:
          GITHUB_TOKEN: ${{ secrets.YRPENG_E3DA_RO }}
        run: node scripts/update-members.js

      - name: Validate Member Profiles
        run: node scripts/validate-members.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/README.md profile/members/

          if git diff --staged --quiet; then
            echo "No member data changes detected. Skipping git push."
            exit 0
          fi

          git commit -m "chore: update member profiles"
          git push origin main
