name: Organization Profile Updater

on:
  schedule:
    # Saturday 19:40 UTC is 03:40 AM China Standard Time
    - cron: '40 19 * * 6'
  workflow_dispatch:
    # Manual runs refresh PNG sources and create JPG fallbacks when absent.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: organization-profile-updater
  cancel-in-progress: true

jobs:
  update-members:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate Member Profiles
        env:
          GITHUB_TOKEN: ${{ secrets.YRPENG_E3DA_RO }}
          UPDATE_AVATARS: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/update-members.js

      - name: Install sharp for JPG fallback
        if: github.event_name == 'workflow_dispatch' && !hashFiles('profile/members/avatars/jpg/**')
        run: npm install --no-save --no-package-lock sharp

      - name: Generate JPG fallbacks
        if: github.event_name == 'workflow_dispatch' && !hashFiles('profile/members/avatars/jpg/**')
        run: node scripts/png2jpg.js

      - name: Refresh profile image references
        if: github.event_name == 'workflow_dispatch' && hashFiles('profile/members/avatars/jpg/**')
        env:
          GITHUB_TOKEN: ${{ secrets.YRPENG_E3DA_RO }}
        run: node scripts/update-members.js

      - name: Validate Member Profiles
        run: node scripts/validate-members.js

      # JPGs are temporary manual-run artifacts. Removing them before the commit
      # keeps the next manual run eligible for conversion and leaves PNG sources
      # as the only committed avatar format.
      - name: Remove temporary JPG fallbacks
        run: rm -rf profile/members/avatars/jpg

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/README.md profile/members/

          if git diff --staged --quiet; then
            echo "No member data changes detected. Skipping git push."
            exit 0
          fi

          git commit -m "chore: update member profiles"
          git push origin main
